plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

tasks.register('probe') {
	doLast {
		def files = configurations.compileClasspath.files
		def cp = files.join(File.pathSeparator)
		def out = new StringBuilder()
		out << "===== MINECRAFT ${project.minecraft_version}\n"
		def javap = "${System.getProperty('java.home')}/bin/javap"
		def jp = { args ->
			def p = new ProcessBuilder([javap] + args).redirectErrorStream(true).start()
			def t = p.inputStream.text
			p.waitFor()
			t
		}
		// Klassen im Minecraft-Jar suchen
		def wanted = ~/net\/minecraft\/client\/.*(Face|Chat(Component|Hud|Listener)|GuiGraphics|Renderable|PlayerSkin|SkinTexture|HudRender|Gui\$|Options).*\.class/
		files.findAll { it.name.endsWith('.jar') && it.name.contains('minecraft') }.each { f ->
			try {
				new java.util.zip.ZipFile(f).withCloseable { z ->
					z.entries().each { e -> if (e.name =~ wanted) out << "CLS ${e.name}\n" }
				}
			} catch (ignored) {}
		}
		def full = [
			'net.minecraft.client.gui.GuiGraphicsExtractor', 'net.minecraft.client.gui.screens.Screen',
			'net.minecraft.client.gui.components.EditBox', 'net.minecraft.client.gui.Gui',
			'net.minecraft.client.gui.components.ChatComponent', 'net.minecraft.client.gui.components.Renderable',
			'net.minecraft.client.gui.components.events.AbstractContainerEventHandler'
		]
		full.each { cls -> out << "\n##### ${cls}\n" << jp(['-protected', '-cp', cp, cls]) }
		def greps = [
			['net.minecraft.client.Minecraft', /(?i)screen|gui|chat|hide/],
			['net.minecraft.client.Options', /(?i)hide|gui/],
			['net.minecraft.client.player.AbstractClientPlayer', /(?i)skin/],
			['net.minecraft.world.entity.Entity', /getName|getPlainTextName|getScoreboardName/],
			['net.minecraft.world.entity.player.Player', /getName|getGameProfile|getPlainTextName/],
			['net.minecraft.world.entity.LivingEntity', /getMainHandItem/],
			['com.mojang.blaze3d.platform.InputConstants', /KEY_O;|Type/]
		]
		greps.each { g ->
			out << "\n##### ${g[0]} (grep)\n"
			jp(['-protected', '-cp', cp, g[0]]).eachLine { if (it =~ g[1]) out << it << "\n" }
		}
		file("probe-${project.minecraft_version}.txt").text = out.toString()
	}
}
