plugins { id 'net.fabricmc.fabric-loom' version "${loom_version}" }
dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}
tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

tasks.register('probe') {
	doLast {
		def files = configurations.compileClasspath.files
		def cp = files.join(File.pathSeparator)
		def out = new StringBuilder()
		out << "===== MINECRAFT ${project.minecraft_version}\n"
		def javap = "${System.getProperty('java.home')}/bin/javap"
		def jp = { args ->
			def p = new ProcessBuilder(([javap] + args).collect { it.toString() }).redirectErrorStream(true).start()
			def t = p.inputStream.text
			p.waitFor()
			t
		}
		// Klassen im Minecraft-Jar suchen
		def wanted = ~/net\/minecraft\/client\/.*(Face|Chat(Component|Hud|Listener)|GuiGraphics|Renderable|PlayerSkin|SkinTexture|HudRender|Gui\$|Options).*\.class/
		files.findAll { it.name.endsWith('.jar') && it.name.contains('minecraft') }.each { f ->
			try {
				new java.util.zip.ZipFile(f).withCloseable { z ->
					z.entries().each { e -> if (e.name =~ wanted) out << "CLS ${e.name}\n" }
				}
			} catch (ignored) {}
		}
		def full = [
			'net.minecraft.client.gui.Gui', 'net.minecraft.client.gui.Hud', 'net.minecraft.client.gui.components.EditBox',
			'net.minecraft.client.gui.components.PlayerFaceExtractor', 'net.minecraft.client.multiplayer.chat.ChatListener',
			'net.minecraft.client.gui.components.AbstractWidget', 'net.minecraft.client.gui.components.Renderable'
		]
		full.each { cls -> out << "\n##### ${cls}\n" << jp(['-protected', '-cp', cp, cls]) }
		out << "\n##### Minecraft (Screen/Gui/Chat)\n"
		jp(['-public', '-cp', cp, 'net.minecraft.client.Minecraft']).eachLine { if (it =~ /(?i)screen|Gui|chat|options|hud/) out << it << "\n" }
		file("probe-${project.minecraft_version}.txt").text = out.toString()
	}
}
