name: API-Probe 26.x
on:
  push:
    branches: [probe-26]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      - name: Probe
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew probe -Pminecraft_version=26.1 -Pfabric_api_version=0.145.1+26.1 2>&1 | tail -40 || true
          ./gradlew probe -Pminecraft_version=26.2 -Pfabric_api_version=0.161.0+26.2 2>&1 | tail -40 || true
          ./gradlew probe -Pminecraft_version=26.3 -Pfabric_api_version=0.165.0+26.3 2>&1 | tail -40 || true
          cat probe-*.txt > probe.txt || echo "keine Ausgabe" > probe.txt
          ls -la probe*.txt
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: probe-26
          name: API-Probe (temporär)
          files: probe.txt
          prerelease: true
