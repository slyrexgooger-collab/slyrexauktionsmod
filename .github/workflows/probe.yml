name: Aufräumen
on:
  push:
    branches: [probe-26]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Temporäres Release löschen
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete probe-26 --cleanup-tag -y --repo "$GITHUB_REPOSITORY" || true
