name: Mod bauen
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Bauen
        shell: bash
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew build 2>&1 | tee build.log
      - name: Fehlerprotokoll veröffentlichen
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: Letztes Bau-Protokoll
          files: build.log
          prerelease: true
      - name: Jar als Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: auktionsmod
          path: build/libs/auktionsmod-*.jar
      - name: Download-Release aktualisieren
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Auktions-Mod (neueste Version)
          body: |
            Fertige Mod für Minecraft 1.21.11 (Fabric).
            `auktionsmod-1.0.0.jar` herunterladen und in `.minecraft/mods` legen (Fabric API wird benötigt).
          files: build/libs/auktionsmod-1.0.0.jar
          make_latest: true
